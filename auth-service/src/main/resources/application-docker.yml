server:
  port: 8081

spring:
  application:
    name: auth-service

  # RSA Keys configuration
  auth:
    jwt:
      keys:
        directory: ${AUTH_JWT_KEYS_DIR:/app/keys}
      expires: ${AUTH_JWT_EXPIRES:PT10M}
    refresh:
      expires: ${AUTH_REFRESH_EXPIRES:P7D}
      max-tokens-per-user: ${AUTH_REFRESH_MAX_TOKENS_PER_USER:5}

  datasource:
    url: jdbc:postgresql://auth-postgres:5432/auth_db
    username: postgres
    password: ${AUTH_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true



logging:
  level:
    root: INFO
    org:
      springframework:
        security: INFO
    ru:
      auth:
        controller: DEBUG
        config:
          JwtAuthenticationFilter: INFO

springdoc:
  swagger-ui:
    enabled: false
    path: /auth/swagger-ui
  api-docs:
    enabled: true
    path: /auth/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /auth/actuator
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: read-only
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    enable:
      http:
        server:
          requests: true
    distribution:
      percentiles-histogram:
        all: true
        "[http.server.requests]": true
      minimum-expected-value:
        "[http.server.requests]": 1ms
      slo:
        "[http.server.requests]":
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2s
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}