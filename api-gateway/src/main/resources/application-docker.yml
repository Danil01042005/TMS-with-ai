spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  codec:
    max-in-memory-size: 16MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          
          - id: auth-actuator
            uri: http://auth-service:8081
            order: -100
            predicates:
              - name: Path
                args:
                  pattern: /auth/actuator/**
          - id: auth-jwks
            uri: http://auth-service:8081
            predicates:
              - name: Path
                args:
                  pattern: /.well-known/**
          - id: auth-service
            uri: http://auth-service:8081
            predicates:
              - name: Path
                args:
                  pattern: /auth/**
          - id: tasks-service
            uri: http://tasks-service:8082
            predicates:
              - name: Path
                args:
                  pattern: /tasks-service/**
          - id: tasks-seo-robots
            uri: http://tasks-service:8082
            predicates:
              - name: Path
                args:
                  pattern: /robots.txt
          - id: tasks-seo-sitemap
            uri: http://tasks-service:8082
            predicates:
              - name: Path
                args:
                  pattern: /sitemap.xml
server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui
    disable-swagger-default-url: true
    urls:
      - name: auth-service
        url: /auth/v3/api-docs
      - name: tasks-service
        url: /tasks-service/v3/api-docs
logging:
  level:
    root: INFO
    "[org.springframework.cloud.gateway]": INFO
    "[org.springframework.web]": INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
        
  metrics:
    enable:
      http:
        server:
          requests: true
    distribution:
      percentiles-histogram:
        all: true
        "[http.server.requests]": true
      minimum-expected-value:
        "[http.server.requests]": 1ms
      slo:
        "[http.server.requests]":
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2s
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}