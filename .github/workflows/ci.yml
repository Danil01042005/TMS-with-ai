name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-wrapper:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, api-gateway]
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "23"

      # v6 runs on Node 24; cache job identity defaults to matrix JSON (per service).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ matrix.service }}

      - name: Run tests
        run: ./gradlew test --no-daemon
        working-directory: ${{ matrix.service }}

  backend-tasks-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "23"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tasks-service tests
        run: gradle test --no-daemon
        working-directory: tasks-service
