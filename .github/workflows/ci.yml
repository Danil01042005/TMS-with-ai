name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ matrix.service }}

      - name: Run tests
        run: ./gradlew test
        working-directory: ${{ matrix.service }}

  backend-tasks-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tasks-service tests
        run: gradle test
        working-directory: tasks-service

